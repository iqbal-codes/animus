name: CI

on:
  push:
    branches: [main, develop, development]
  pull_request:
    branches: [main, develop, development]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  gate-static:
    name: "Gate 1: Static Lint, Format & Architecture Check"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Frozen dependency install
        run: bun install --frozen-lockfile

      - name: Executable architecture boundary check
        run: node scripts/health/check-architecture.mjs

      - name: Format check
        run: bun run format

      - name: Lint check
        run: bun run lint

  gate-verify:
    name: "Gate 2: Typecheck, Unit & Offline Integration Verification"
    needs: [gate-static]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Frozen dependency install
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Toolchain check
        run: node scripts/health/check-toolchain.mjs

      - name: Offline test suite
        run: bun run test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate-build:
    name: "Gate 3: Release Packaging Validation"
    needs: [gate-verify]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Frozen dependency install
        run: bun install --frozen-lockfile

      - name: Build per-target CLI binaries
        run: bun run build:cli:release

      - name: Verify release packaging and checksum generation
        run: bun run package:release

      - name: Verify CLI binary smoke
        run: |
          bun -e "
            import { verifyCliBinarySmoke } from './scripts/release/build-cli.ts';
            await verifyCliBinarySmoke({
              binaryPath: './dist/release/linux-x64/animus',
            });
            console.log('CLI binary smoke verification passed');
          "

      - name: Verify every packaged binary matches its target
        run: |
          bun -e "
            import { readdirSync } from 'node:fs';
            import { join } from 'node:path';
            import { verifyDistributionTarball } from './scripts/release/package.ts';

            const dir = 'dist/releases';
            const cliTarball = /^animus-v[0-9.]+-(darwin|linux)-(arm64|x64)\\.tar\\.gz$/;
            let verified = 0;

            for (const file of readdirSync(dir)) {
              const match = cliTarball.exec(file);
              if (!match) continue;
              const target = { platform: match[1], arch: match[2] };
              const members = verifyDistributionTarball(join(dir, file), target);
              console.log(file + ' -> ' + members.animus.format + '/' + members.animus.archs.join('+'));
              verified += 1;
            }

            if (verified !== 4) throw new Error('Expected 4 verified CLI tarballs, saw ' + verified);
          "

      - name: Verify SHA-256 checksums
        run: |
          cd dist/releases
          sha256sum -c checksums.txt

  ci-gate:
    name: "Gate Aggregate: CI Pass/Fail Evaluator"
    needs: [gate-static, gate-verify, gate-build]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Evaluate Aggregate CI Gate Outcome
        run: node scripts/health/check-ci-gate.mjs
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
